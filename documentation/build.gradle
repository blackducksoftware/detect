import com.blackduck.integration.detect.docs.GenerateDocsTask

File generatedDir = new File(buildDir, "generated")
File ditaSiteDir = new File(buildDir, "ditasite")

task generateDocs(type: GenerateDocsTask) {
    dependsOn rootProject.helpJson
}

String findDita() {
    return System.getProperty("os.name").toLowerCase().contains("windows") ? 'dita.bat' : 'dita';
}

// Requires Black Duck-configured dita:
// 1. git clone https://gitlab.tools.duckutil.net/doc/docs-dita-tools.git
// 2. Add docs-dita-tools/dita-ot/bin to your PATH
// 3. Add DOCS_DITA_TOOLS as an environment variable with the path set to the docs-dita-tools folder

task ditasite() {
    dependsOn generateDocs

    doLast {
        String docsDitaTools = System.getenv('DOCS_DITA_TOOLS')
        String webhelpString = '-Dwebhelp.publishing.template=' + docsDitaTools + '/templates/bd-webhelp'
        ByteArrayOutputStream stdOut = new ByteArrayOutputStream()
        ByteArrayOutputStream stdError = new ByteArrayOutputStream()
        exec {
            commandLine findDita(), '-v', '--input=detect.ditamap', '--format=webhelp-responsive', '-output', '../ditasite', webhelpString, '-Dwebhelp.publishing.template.descriptor=bd-tiles.opt'
            workingDir generatedDir
            standardOutput = stdOut
            errorOutput = stdError
        }
        for (String outputLine : stdError.toString().split(System.lineSeparator())) {
            if (outputLine.matches(".*File.*helpJsonFile:.*not found.*")) throw new Exception("dita error: invalid link: " + outputLine)
        }
        for (String outputLine : stdOut.toString().split(System.lineSeparator())) {
            if (outputLine.matches(".*\\[DOT.*\\].*\\[ERROR\\].*")) throw new Exception("dita error. To run dita by hand: cd documentation/build/generated; dita -format webhelp-responsive -input detect.ditamap -output ../ditasite -Dwebhelp.publishing.template==<PATH to docs-dita-tools>/templates/bd-webhelp -Dwebhelp.publishing.template.descriptor=bd-tiles.opt -v\nERROR: " + outputLine)

            if (outputLine.matches(".*\\[keyref\\].*\\[DOTJ047I\\].*")) throw new Exception("dita found invalid key references. Square brackets around doc text must be escaped if not inside back quotes. To run dita by hand: cd documentation/build/generated; dita -format webhelp-responsive -input detect.ditamap -output ../ditasite -Dwebhelp.publishing.template==<PATH TO docs-dita-tools>/templates/bd-webhelp -Dwebhelp.publishing.template.descriptor=bd-tiles.opt -v\nERROR: " + outputLine)
        }
        File indexHtmlFile = new File(project.getBuildDir(), "ditasite/index.html")
        println "To browse the webhelp: Open file://${indexHtmlFile.getAbsolutePath()} in a browser"
        try {
            Desktop.desktop.browse indexHtmlFile.toURI()
        } catch (Exception e) {
            println "Could not automatically open the generated ditasite (Not an error) "
        }
    }
}

task ditasourcezip(type: Zip) {
    // depending on ditasite does some validation of the files going into the dita source zip
    dependsOn ditasite

    archiveFileName = "${rootProject.name}-${version}-ditasource.zip"
    from generatedDir
    destinationDirectory.set(file("${buildDir}/libs/"))
}

task publishDitaSource() {
    dependsOn ditasourcezip

    doLast {
        def ditaSourceZipName = "${rootProject.name}-${version}-ditasource.zip"
        def ditaSourceZipLocation = "${buildDir}/libs/${ditaSourceZipName}"
        exec {
            commandLine 'curl', '--insecure', '-u', "${project.ext.artifactoryDeployerUsername}:${project.ext.artifactoryDeployerPassword}", '-X', 'PUT',
                    "${project.ext.deployArtifactoryUrl}/${project.ext.artifactoryRepo}/com/blackduck/integration/${rootProject.name}/${version}/${ditaSourceZipName}", '-T', "${ditaSourceZipLocation}", '-f'
        }
    }
}

task helppdf() {
    dependsOn generateDocs

    doLast {
        exec {
            commandLine 'dita', '--input=detect.ditamap', '--format=synopsyspdf', "--outputFile.base=${project.name}-${version}-help", '-o', '../../build/libs'
            workingDir generatedDir
        }
    }
}

task helpzip(type: Zip) {
    dependsOn ditasite

    archiveFileName = "${project.name}-${version}-help.zip"
    from ditaSiteDir
    destinationDirectory.set(file("${buildDir}/libs/"))
}

task docs() {
    dependsOn ditasite
}

task cleanDocs(type: Delete) {
    delete generatedDir, ditaSiteDir
    followSymlinks = false
}

clean.dependsOn cleanDocs
